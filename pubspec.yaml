name: cashwise_ai
description: "Flutter finance coach — offline expenses, cash-flow predictor, Loan Ledger with reminders, English/Urdu, Rs. amounts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  fl_chart: ^1.2.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
